# Integritetspolicy (/integritetspolicy) — redigeras i Sveltia CMS.
title: Integritetspolicy
width: narrow
intro: Den här integritetspolicyn beskriver hur vi samlar in, använder och skyddar dina personuppgifter när du använder vår webbplats och våra tjänster.
sections:
    - title: Vilken information samlar vi in?
      body: |
          Vi samlar in olika typer av personuppgifter för att kunna erbjuda dig bästa möjliga vård och service.

          - **Personuppgifter:** Namn, personnummer, kontaktuppgifter (telefonnummer, e-postadress, adress)
          - **Hälsoinformation:** Meddelande till vården, bokningar, besökshistorik, medicinsk information
          - **Användardata:** IP-adress, webbläsartyp, enhetsinformation, tid och datum för användning
          - **Kommunikation:** Korrespondens med oss, samtycken, feedback och klagomål
    - title: Hur använder vi din information?
      body: |
          Vi använder dina personuppgifter för olika ändamål som är nödvändiga för att kunna erbjuda vårdtjänster.

          - För att kunna diagnostisera, behandla och vårda dig
          - För att boka och administrera dina besök hos oss
          - För att kommunicera med dig om din vård
          - För att utveckla och förbättra våra tjänster
          - För att uppfylla lagkrav inom hälso- och sjukvården
          - För att hantera fakturering och betalningar
    - title: Rättslig grund för behandling
      body: |
          Vår behandling av dina personuppgifter baseras på olika rättsliga grunder enligt GDPR.

          - **Rättslig förpliktelse:** Vissa uppgifter måste vi hantera enligt lag (t.ex. patientjournal-lagen)
          - **Allmänt intresse:** För att kunna bedriva hälso- och sjukvård
          - **Samtycke:** När du aktivt har gett ditt samtycke till viss behandling
          - **Avtal:** När behandlingen är nödvändig för att fullgöra ett avtal med dig
    - title: Delning av information
      body: |
          Vi delar dina personuppgifter endast när det är nödvändigt för att kunna erbjuda vård och service.

          - **Vårdpersonal:** Dina uppgifter delas med den vårdpersonal som är involverad i din behandling
          - **Regionens journalsystem:** Din journal lagras i regionens gemensamma journalsystem
          - **Myndigheter:** Vi delar information när vi är skyldiga enligt lag (t.ex. till Socialstyrelsen)
          - **Vårdgivare:** Information kan delas med andra vårdgivare vid remisser eller samverkan
    - title: Säkerhet
      body: |
          Vi vidtar lämpliga tekniska och organisatoriska åtgärder för att skydda dina personuppgifter.

          - Alla system är skyddade med kryptering
          - Endast behörig personal har tillgång till dina uppgifter
          - Vi genomför regelbundna säkerhetskontroller
          - All personal är bunden av tystnadsplikt
    - title: Dina rättigheter
      body: |
          Som registrerad har du flera rättigheter enligt GDPR.

          - **Rätt att få information:** Du har rätt att veta vilka uppgifter vi behandlar om dig
          - **Rätt till registerutdrag:** Du kan begära en kopia av dina personuppgifter
          - **Rätt till rättelse:** Du kan begära att vi korrigerar felaktiga uppgifter
          - **Rätt till radering:** I vissa fall kan du begära att dina uppgifter raderas
          - **Rätt till dataportabilitet:** Du kan begära att få dina uppgifter i ett maskinläsbart format
          - **Rätt att invända:** Du kan invända mot viss behandling av dina personuppgifter
    - title: Kakor (Cookies)
      body: |
          Vår webbplats använder kakor för att förbättra användarupplevelsen och för webbanalys.

          - **Nödvändiga kakor:** Grundläggande funktioner på webbplatsen kräver vissa kakor
          - **Analyskakor:** Vi använder analysverktyg för att förstå hur webbplatsen används
          - **Valfrihet:** Du kan välja att inte acceptera kakor via dina webbläsarinställningar
    - title: Kontaktinformation
      body: |
          Om du har frågor om vår integritetspolicy eller hur vi behandlar dina personuppgifter är du välkommen att kontakta oss.

          - **Dataskyddsombud:** Anna Andersson
          - **E-post:** dataskydd@vardcentralen.se
          - **Telefon:** 08-123 456 78
          - **Adress:** Vårdportalen, Storgatan 12, 123 45 Stockholm
