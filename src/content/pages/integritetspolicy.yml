# Integritetspolicy (/integritetspolicy) — redigeras i Sveltia CMS.
title: Integritetspolicy
width: narrow
intro: Den här integritetspolicyn beskriver hur vi samlar in, använder och skyddar dina personuppgifter när du använder vår webbplats och våra tjänster.
sections:
    - title: Vilken information samlar vi in?
      paragraphs:
          - text: Vi samlar in olika typer av personuppgifter för att kunna erbjuda dig bästa möjliga vård och service.
      list:
          - title: 'Personuppgifter:'
            description: Namn, personnummer, kontaktuppgifter (telefonnummer, e-postadress, adress)
          - title: 'Hälsoinformation:'
            description: Meddelande till vården, bokningar, besökshistorik, medicinsk information
          - title: 'Användardata:'
            description: IP-adress, webbläsartyp, enhetsinformation, tid och datum för användning
          - title: 'Kommunikation:'
            description: Korrespondens med oss, samtycken, feedback och klagomål
    - title: Hur använder vi din information?
      paragraphs:
          - text: Vi använder dina personuppgifter för olika ändamål som är nödvändiga för att kunna erbjuda vårdtjänster.
      list:
          - text: För att kunna diagnostisera, behandla och vårda dig
          - text: För att boka och administrera dina besök hos oss
          - text: För att kommunicera med dig om din vård
          - text: För att utveckla och förbättra våra tjänster
          - text: För att uppfylla lagkrav inom hälso- och sjukvården
          - text: För att hantera fakturering och betalningar
    - title: Rättslig grund för behandling
      paragraphs:
          - text: Vår behandling av dina personuppgifter baseras på olika rättsliga grunder enligt GDPR.
      list:
          - title: 'Rättslig förpliktelse:'
            description: Vissa uppgifter måste vi hantera enligt lag (t.ex. patientjournal-lagen)
          - title: 'Allmänt intresse:'
            description: För att kunna bedriva hälso- och sjukvård
          - title: 'Samtycke:'
            description: När du aktivt har gett ditt samtycke till viss behandling
          - title: 'Avtal:'
            description: När behandlingen är nödvändig för att fullgöra ett avtal med dig
    - title: Delning av information
      paragraphs:
          - text: Vi delar dina personuppgifter endast när det är nödvändigt för att kunna erbjuda vård och service.
      list:
          - title: 'Vårdpersonal:'
            description: Dina uppgifter delas med den vårdpersonal som är involverad i din behandling
          - title: 'Regionens journalsystem:'
            description: Din journal lagras i regionens gemensamma journalsystem
          - title: 'Myndigheter:'
            description: Vi delar information när vi är skyldiga enligt lag (t.ex. till Socialstyrelsen)
          - title: 'Vårdgivare:'
            description: Information kan delas med andra vårdgivare vid remisser eller samverkan
    - title: Säkerhet
      paragraphs:
          - text: Vi vidtar lämpliga tekniska och organisatoriska åtgärder för att skydda dina personuppgifter.
      list:
          - text: Alla system är skyddade med kryptering
          - text: Endast behörig personal har tillgång till dina uppgifter
          - text: Vi genomför regelbundna säkerhetskontroller
          - text: All personal är bunden av tystnadsplikt
    - title: Dina rättigheter
      paragraphs:
          - text: Som registrerad har du flera rättigheter enligt GDPR.
      list:
          - title: 'Rätt att få information:'
            description: Du har rätt att veta vilka uppgifter vi behandlar om dig
          - title: 'Rätt till registerutdrag:'
            description: Du kan begära en kopia av dina personuppgifter
          - title: 'Rätt till rättelse:'
            description: Du kan begära att vi korrigerar felaktiga uppgifter
          - title: 'Rätt till radering:'
            description: I vissa fall kan du begära att dina uppgifter raderas
          - title: 'Rätt till dataportabilitet:'
            description: Du kan begära att få dina uppgifter i ett maskinläsbart format
          - title: 'Rätt att invända:'
            description: Du kan invända mot viss behandling av dina personuppgifter
    - title: Kakor (Cookies)
      paragraphs:
          - text: Vår webbplats använder kakor för att förbättra användarupplevelsen och för webbanalys.
      list:
          - title: 'Nödvändiga kakor:'
            description: Grundläggande funktioner på webbplatsen kräver vissa kakor
          - title: 'Analyskakor:'
            description: Vi använder analysverktyg för att förstå hur webbplatsen används
          - title: 'Valfrihet:'
            description: Du kan välja att inte acceptera kakor via dina webbläsarinställningar
    - title: Kontaktinformation
      paragraphs:
          - text: Om du har frågor om vår integritetspolicy eller hur vi behandlar dina personuppgifter är du välkommen att kontakta oss.
      list:
          - title: 'Dataskyddsombud:'
            description: Anna Andersson
          - title: 'E-post:'
            description: dataskydd@vardcentralen.se
          - title: 'Telefon:'
            description: 08-123 456 78
          - title: 'Adress:'
            description: Vårdportalen, Storgatan 12, 123 45 Stockholm
      updated: 'Senast uppdaterad: 2023-11-15'
