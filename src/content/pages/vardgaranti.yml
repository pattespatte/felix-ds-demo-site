sections:
    - title: Vad innebär vårdgarantin för dig?
      paragraphs:
          - text: Vårdgarantin är en del av hälso- och sjukvårdslagen och syftar till att säkerställa att alla patienter får vård i tid oavsett var i landet de bor. Garantin gäller från det att du söker vård tills du har fått behövlig behandling.
          - text: Det är viktigt att veta att vårdgarantin inte gäller för alla typer av vård. Vissa planerade operationer och behandlingar kan ha längre väntetider. Din läkare eller vårdgivare kan ge dig mer information om vad som gäller för just ditt fall.
    - title: Vanliga frågor om vårdgaranti
      accordion:
          - title: Vad innebär vårdgarantin?
            content: Vårdgarantin är en lagstadgad rättighet som säkerställer att du får vård inom en viss tid. Den garanterar att du får kontakt med vårdcentral inom 7 dagar, får träffa specialist inom 90 dagar, och får behandling inom 90 dagar efter att diagnosen har ställts. Syftet är att säkerställa jämlik tillgång till vård oavsett var i landet du bor.
          - title: Vad gäller för akuta besvär?
            content: Vårdgarantin gäller inte för akuta sjukdomar eller skador som kräver omedelbar vård. Om du har akuta besvär ska du alltid kontakta 1177 för rådgivning, söka vårdcentralens akutmottagning eller vid allvarliga tillstånd ringa 112. Akuta fall prioriteras alltid och ska få vård omedelbart.
          - title: Vad händer om tiden överskrids?
            content: Om du inte får vård inom den garanterade tiden har du rätt att söka vård i ett annat landsting/region. Du kan också kontakta vården och fråga om varför väntetiden är längre än garanterat. I vissa fall kan du ha rätt till ersättning om du har fått bekosta vården själv på grund av att väntetiden överskreds.
          - title: Gäller garantin för alla typer av vård?
            content: Vårdgarantin gäller för de flesta typer av specialiserad vård inom landstingets hälso- och sjukvård. Den omfattar bland annat läkarbesök, operationer och vissa undersökningar. Vissa specifika behandlingar kan ha egna väntetider som inte omfattas av garantin. Din vårdgivare kan ge dig mer information om vad som gäller för just ditt fall.
    - title: Kontakt och mer information
      paragraphs:
          - text: 'Om du har frågor om vårdgarantin eller om du tror att dina rättigheter har åsidosatts kan du kontakta:'
      list:
          - text: Din vårdcentral för information om väntetider
          - text: 1177 Vårdguiden för generell rådgivning om vårdgarantin
          - text: Patientnämnden i ditt landsting för att framföra klagomål
          - text: Inspektionen för vård och omsorg (IVO) för mer information om patienträttigheter
