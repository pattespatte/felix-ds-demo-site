# Vårdgaranti (/patientinformation/vardgaranti) — redigeras i Sveltia CMS.
title: Vårdgaranti
intro: Som patient i Sverige har du lagstadgad rätt till vård inom en viss tid. Här hittar du information om vad vårdgarantin innebär och vilka rättigheter du har.
notice: '**Viktigt:** Vårdgarantin gäller från den dag du söker vård och fram till att du fått den vård du behöver. Spara alla remisser och journaler som bevis på när du sökte vård.'
infoCards:
    - title: Noll dagar
      content: Kontakt med vårdcentral
    - title: 3 dagar
